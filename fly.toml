# Fly.io configuration for the dispatch pilot: one always-on collector in Chicago.
# The owner creates the app via the Fly website (Phase 8); the first deploy comes from the
# release PR through GitHub Actions, which adopts this file.
app = "dispatch-pilot"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  # Baked static mode: copy the image's baked.db into the volume DB instead of parsing the zip
  # (Phase 7b). The GTFS parse never runs on this machine.
  BAKED_STATIC_DB = "/app/baked.db"
  # Flat decision cadence; the global fact pass still runs every 10 s.
  DECISION_INTERVAL_SECONDS = "30"

[http_service]
  internal_port = 8080
  force_https = true
  # The collector must never autostop: it evaluates the whole active board continuously and
  # records facts/recommendations with no viewer.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # /api/health returns 200 even while static GTFS loads (phase communicates detail), which is
  # fine for keep-alive. At boot the baked-static copy runs synchronously on the main thread
  # (~104 s measured, longer on shared-cpu), during which /api/health cannot respond at all —
  # so the grace period must cover the whole boot-to-ready window, not just process start.
  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "5m"
    method = "GET"
    path = "/api/health"

# 1 GB is sufficient in baked mode: the ~3.5 GB parse happens in CI, and the runtime copies the
# static tables with SQL-level INSERT ... SELECT (steady-state RSS ~368 MB + the copy). The
# decision cadence is CPU-bound, not memory-bound, so the faster tick needs no memory change.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# 1 GB persistent volume for dispatch.db + the cached GTFS zip. Created by the owner at launch
# (`fly volumes create data --size 1 --region ord`).
[[mounts]]
  source = "data"
  destination = "/data"

# Let the refresh loop settle on shutdown; facts are committed synchronously to SQLite.
kill_timeout = 30
