# Fly.io configuration for the dispatch pilot: one always-on collector in Chicago.
# The owner creates the app via the Fly website (Phase 8); the first deploy comes from the
# release PR through GitHub Actions, which adopts this file.
app = "dispatch-pilot"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  # Baked static mode: copy the image's baked.db into the volume DB instead of parsing the zip
  # (Phase 7b). The GTFS parse never runs on this machine.
  BAKED_STATIC_DB = "/app/baked.db"
  # Flat decision cadence — 30 s is a fixed owner requirement: hold recommendations must be
  # within ~30 s of becoming actionable. The interim 60 s is superseded (owner call); the
  # Phase 10 chunked pass (plan 10a) keeps a 30 s cadence from blocking the event loop.
  # With the current 3-route focus a pass is ~1-4 s on shared-cpu-1x; if passes outgrow the
  # cadence, report it — do not slow the tick.
  DECISION_INTERVAL_SECONDS = "30"

[http_service]
  internal_port = 8080
  force_https = true
  # The collector must never autostop: it evaluates the whole active board continuously and
  # records facts/recommendations with no viewer.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Tolerant HTTP health check (plan Phase 10c), re-added only after the chunked decision pass
  # (10a) and the abandoned-loop fix (10e) landed. The decision pass now yields between slices and
  # a wedged cycle is abandoned within REFRESH_ABANDON_SECONDS, so the 25 s timeout comfortably
  # covers any residual slice stall without the 10-18 s blocking pass that caused the first
  # production day's edge unrouting. /api/health returns 200 even while static is loading.
  [[http_service.checks]]
    interval = "10s"
    timeout = "25s"
    grace_period = "1m"
    method = "GET"
    path = "/api/health"

# 1 GB is sufficient in baked mode: the ~3.5 GB parse happens in CI, and the runtime copies the
# static tables with SQL-level INSERT ... SELECT (steady-state RSS ~368 MB + the copy). The
# decision cadence is CPU-bound, not memory-bound, so the faster tick needs no memory change.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# 10 GB persistent volume for dispatch.db — the full free-allowance maximum ($0; billing
# starts above 10 GB). Must be ≥2 GB because of the WAL spike: the baked copy runs as ONE
# transaction and the WAL cannot checkpoint past an open transaction, so peak disk is
# DB (~640 MB) + WAL (~500-650 MB) during each daily copy — 1 GB would hit SQLITE_FULL on the
# second day. Created by the owner at launch (`fly volumes create data --size 10 --region ord`).
[[mounts]]
  source = "data"
  destination = "/data"

# Let the refresh loop settle on shutdown; facts are committed synchronously to SQLite.
kill_timeout = 30
